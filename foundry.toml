[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.ci.fuzz]
runs = 1024

[fuzz]
runs = 512

[fmt]
line_length = 120
sort_imports = true
int_types = "long"
wrap_comments = true

# Lint the contracts only. No separator after test, so the pattern matches on Windows too.
[lint]
ignore = ["test**"]
